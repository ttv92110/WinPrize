<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #333;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
        }
        .content {
            padding: 40px 30px;
            text-align: center;
        }
        .prize {
            font-size: 48px;
            color: #28a745;
            font-weight: 800;
        }
        .winner-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 20px;
        }
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Congratulations! 🏆</h1>
        </div>
        <div class="content">
            <div class="winner-icon">🎉</div>
            <p>Hello <strong>{{ user_name }}</strong>,</p>
            <p>You are the winner of <strong>{{ draw_title }}</strong>!</p>
            <p>You have won:</p>
            <div class="prize">Rs. {{ prize_amount }}</div>
            <p>The prize amount will be credited to your account soon.</p>
            <div style="text-align: center;">
                <a href="https://winprize.vercel.app/winner" class="button">View Winners</a>
            </div>
        </div>
        <div class="footer">
            <p>© 2026 WinPrize. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
