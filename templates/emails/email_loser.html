<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .content {
            padding: 40px 30px;
            text-align: center;
        }
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 20px;
        }
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Draw Result Announced</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{ user_name }}</strong>,</p>
            <p>The winner for <strong>{{ draw_title }}</strong> has been announced.</p>
            <p>Unfortunately, you didn't win this time.</p>
            <p>Don't worry! More draws are coming soon. Better luck next time! 🍀</p>
            <div style="text-align: center;">
                <a href="https://winprize.onrender.com/#draws" class="button">View Active Draws</a>
            </div>
        </div>
        <div class="footer">
            <p>© 2026 WinPrize. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
