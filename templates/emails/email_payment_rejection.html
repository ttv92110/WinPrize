<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .content {
            padding: 40px 30px;
        }
        .reason-box {
            background: #f8f9fa;
            border-left: 4px solid #dc3545;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .button {
            display: inline-block;
            background: #dc3545;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 20px;
        }
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>❌ Payment Rejected</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{ user_name }}</strong>,</p>
            <p>Your payment for <strong>{{ draw_title }}</strong> has been rejected.</p>
            
            <div class="reason-box">
                <p><strong>Amount:</strong> Rs. {{ amount }}</p>
                <p><strong>Reason:</strong> {{ reason }}</p>
            </div>
            
            <p>Please contact support for further assistance or try again with correct payment details.</p>
            <div style="text-align: center;">
                <a href="https://winprize.vercel.app/payment-status" class="button">View Payment Status</a>
            </div>
        </div>
        <div class="footer">
            <p>© 2026 WinPrize. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
