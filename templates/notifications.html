<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - WinPrize</title>
    <link rel="icon" type="image/x-icon" href="../static/images/favicon_icon.png" /> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../static/images/favicon_icon.png" /> 

    <style>
        .notification-bell {
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
            margin-right: 20px;
        }
        .notification-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 3px 6px;
            font-size: 0.7rem;
            min-width: 18px;
            text-align: center;
        }
        .notification-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        .notification-item:hover {
            transform: translateX(5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .notification-item.unread {
            background: #f0f7ff;
            border-left-color: #667eea;
        }
        .notification-item.new-draw {
            border-left-color: #28a745;
        }
        .notification-item.payment-update {
            border-left-color: #ffc107;
        }
        .notification-item.draw-result {
            border-left-color: #17a2b8;
        }
        .notification-time {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .notification-actions {
            margin-top: 15px;
        }
        .mark-read-btn {
            background: transparent;
            border: 1px solid #dee2e6;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .mark-read-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-trophy text-warning me-2"></i>
                WinPrize
            </a>
            <div class="navbar-nav ms-auto d-flex align-items-center">
                <div class="notification-bell" onclick="window.location.href='/notifications'">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationBadge">0</span>
                </div>
                <a href="/" class="btn btn-outline-light me-2">
                    <i class="fas fa-home me-2"></i>Home
                </a>
                <div id="userMenu"></div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">
                        <i class="fas fa-bell me-2 text-primary"></i>
                        Notifications
                    </h2>
                    <button class="btn btn-outline-primary" onclick="markAllAsRead()">
                        <i class="fas fa-check-double me-2"></i>Mark All as Read
                    </button>
                </div>
            </div>
        </div>

        <div id="loadingState" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Loading notifications...</p>
        </div>

        <div id="notificationsContainer" style="display: none;"></div>

        <div id="emptyState" class="text-center py-5" style="display: none;">
            <i class="fas fa-bell-slash fa-4x text-muted mb-3"></i>
            <h3>No Notifications</h3>
            <p class="text-muted">You're all caught up!</p>
            <a href="/#draws" class="btn btn-primary mt-3">Browse Draws</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/app.js"></script> 
    <script src="../static/js/notification.js"></script>
</body>
</html>
